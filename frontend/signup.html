<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKAttendance - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 480px; /* Slightly wider for the double columns if needed, or comfortable single column layout */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <div class="logo-circle">
                    <span>GK</span>
                </div>
                <h1>GKAttendance</h1>
                <p>User Registration</p>
            </div>
            
            <form id="signup-form">
                <div class="input-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                </div>

                <div class="input-group">
                    <label for="lab_id">GK Lab Division</label>
                    <select id="lab_id" name="lab_id" required>
                        <option value="" disabled selected>Loading labs...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="role_id">System Role</label>
                    <select id="role_id" name="role_id" required>
                        <option value="" disabled selected>Loading roles...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="dlsu_idnumber">DLSU ID Number</label>
                    <input type="number" id="dlsu_idnumber" name="dlsu_idnumber" placeholder="Enter your 8-digit DLSU ID" required>
                </div>

                <div class="input-group">
                    <label for="unique_id">RFID Card / Unique ID</label>
                    <input type="number" id="unique_id" name="unique_id" placeholder="Scan your RFID Card here" required>
                </div>
                
                <button type="submit" class="login-btn" id="signup-btn" style="margin-top: 24px;">
                    <span>Create Account</span>
                    <div class="spinner" id="btn-spinner"></div>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login">Sign In</a>
            </div>
            
            <div id="message" class="message hidden"></div>
        </div>
    </div>
    
    <script src="signup.js"></script>
</body>
</html>
