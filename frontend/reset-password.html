<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GKAttendance - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">

            <div class="logo-container">
                <div class="logo-circle">
                    <span>GK</span>
                </div>
                <h1>GKAttendance</h1>
                <p>Reset Password</p>
            </div>

            <form id="reset-password-form">

                <div class="input-group">
                    <label for="code">Verification Code</label>
                    <input type="text" id="code" name="code" placeholder="Enter 6-digit code" required maxlength="6"
                        pattern="\d{6}">
                </div>

                <button type="button" id="verify-code-btn" class="login-btn">
                    Verify Code
                </button>

                <div id="password-section" style="display: none;">

                    <div class="input-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter new password"
                            minlength="6" required>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm new password" minlength="6" required>
                    </div>

                    <button type="submit" class="login-btn">
                        Reset Password
                    </button>

                </div>

            </form>

            <div id="message" class="message hidden"></div>

            <div class="auth-footer">
                Return to <a href="/index">Sign In</a>
            </div>

        </div>
    </div>

    <script src="reset-password.js"></script>
</body>

</html>
